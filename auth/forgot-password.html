<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recuperar palavra-passe | Espaço ON</title>
  <meta name="robots" content="noindex">
  <link rel="shortcut icon" href="../assets/images/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="../assets/css/icons.min.css" rel="stylesheet">
  <link href="../assets/css/base.css" rel="stylesheet">
  <link href="../assets/css/auth.css" rel="stylesheet">
</head>
<body>
  <div class="auth">
    <aside class="auth__aside"><a href="../telas/Tela principal.html"><img src="../assets/images/espacon-logo.png" alt="Espaço ON" width="158" height="51"></a><div class="auth__pitch"><h2>Recupere o acesso com segurança.</h2><p>Validaremos a sua identidade com um código enviado para o telefone associado à conta.</p></div></aside>
    <main class="auth__panel">
      <div class="auth__form">
        <a class="brand" href="../telas/Tela principal.html"><img src="../assets/images/espacon-logo.png" alt="Espaço ON" width="150" height="49"></a>
        <h1>Esqueci a palavra-passe</h1>
        <p id="resetIntro">Indique o telefone ou e-mail associado à sua conta.</p>
        <form id="requestResetForm" novalidate><label class="field"><span>Telefone ou e-mail</span><input name="identifier" type="text" autocomplete="username" required></label><p class="auth-error" id="requestResetError" role="alert"></p><button class="btn btn--primary btn--block" type="submit">Receber código OTP</button></form>
        <form id="confirmResetForm" class="is-hidden" novalidate><div class="otp-demo"><small>Código fictício para demonstração</small><strong>246810</strong></div><label class="field"><span>Código OTP</span><input name="otp" type="text" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" required></label><div class="field password-field"><label for="resetPassword"><span>Nova palavra-passe</span></label><input id="resetPassword" name="password" type="password" minlength="8" required><button type="button" data-toggle-password="resetPassword" aria-label="Mostrar palavra-passe"><i class="bx bx-show"></i></button></div><div class="field password-field"><label for="resetConfirmation"><span>Confirmar palavra-passe</span></label><input id="resetConfirmation" name="confirmation" type="password" minlength="8" required><button type="button" data-toggle-password="resetConfirmation" aria-label="Mostrar palavra-passe"><i class="bx bx-show"></i></button></div><p class="auth-error" id="confirmResetError" role="alert"></p><button class="btn btn--primary btn--block" type="submit">Definir nova palavra-passe</button></form>
        <a class="auth__back" href="login.html"><i class="bx bx-left-arrow-alt"></i> Voltar ao login</a>
      </div>
    </main>
  </div>
  <script src="../assets/js/auth.js?v=20260804-password-confirmation"></script>
  <script src="../assets/js/account-flow.js"></script>
</body>
</html>
