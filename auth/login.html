<!DOCTYPE html>
<html lang="pt">
<head>
     <meta charset="utf-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Login | Salao de Eventos</title>
     <meta name="robots" content="noindex">
     <link rel="shortcut icon" href="../assets/images/favicon.ico">
     <link href="../assets/css/vendor.min.css" rel="stylesheet" type="text/css">
     <link href="../assets/css/icons.min.css" rel="stylesheet" type="text/css">
     <link href="../assets/css/app.min.css" rel="stylesheet" type="text/css">
     <link href="../assets/css/site.css" rel="stylesheet" type="text/css">
     <script src="../assets/js/config.min.js"></script>
</head>

<body class="authentication-bg">
     <div class="account-pages pt-2 pt-sm-5 pb-4 pb-sm-5">
          <div class="container">
               <div class="row justify-content-center">
                    <div class="col-xl-5 col-lg-6">
                         <div class="card auth-card">
                              <div class="card-body px-3 py-5">
                                   <div class="mx-auto mb-4 text-center auth-logo">
                                        <a href="../telas/Tela principal.html" class="logo-dark">
                                             <img src="../assets/images/logo-sm.png" height="30" class="me-1" alt="Logo">
                                             <img src="../assets/images/logo-dark.png" height="24" alt="Salao de Eventos">
                                        </a>
                                        <a href="../telas/Tela principal.html" class="logo-light">
                                             <img src="../assets/images/logo-sm.png" height="30" class="me-1" alt="Logo">
                                             <img src="../assets/images/logo-light.png" height="24" alt="Salao de Eventos">
                                        </a>
                                   </div>

                                   <h2 class="fw-bold text-center fs-18">Entrar</h2>
                                   <p class="text-muted text-center mt-1 mb-4">Acesse o painel administrativo do salao de eventos.</p>

                                   <div class="px-4">
                                        <form action="../telas/Tela principal.html" class="authentication-form needs-validation" novalidate>
                                             <div class="mb-3">
                                                  <label class="form-label" for="email">Email</label>
                                                  <input type="email" id="email" name="email" class="form-control" placeholder="nome@exemplo.com" required>
                                                  <div class="invalid-feedback">Informe um email valido.</div>
                                             </div>
                                             <div class="mb-3">
                                                  <label class="form-label" for="password">Senha</label>
                                                  <input type="password" id="password" name="password" class="form-control" placeholder="Digite a senha" required>
                                                  <div class="invalid-feedback">Informe a senha.</div>
                                             </div>
                                             <div class="mb-3">
                                                  <div class="form-check">
                                                       <input type="checkbox" class="form-check-input" id="remember">
                                                       <label class="form-check-label" for="remember">Manter sessao iniciada</label>
                                                  </div>
                                             </div>
                                             <div class="mb-1 text-center d-grid">
                                                  <button class="btn btn-primary" type="submit">Entrar</button>
                                             </div>
                                        </form>
                                   </div>
                              </div>
                         </div>

                         <p class="mb-0 text-center">Novo utilizador? <a href="register.html" class="text-reset fw-bold ms-1">Criar conta</a></p>
                    </div>
               </div>
          </div>
     </div>

     <script src="../assets/js/vendor.js"></script>
     <script src="../assets/js/app.js"></script>
</body>
</html>
