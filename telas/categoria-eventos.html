<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Categorias de eventos | Espaço ON</title>
  <meta name="description" content="Espaços para eventos sociais e corporativos em Maputo.">
  <meta name="theme-color" content="#06253c">
  <link rel="shortcut icon" href="../assets/images/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="../assets/css/icons.min.css" rel="stylesheet">
  <link href="../assets/css/base.css" rel="stylesheet">
  <link href="../assets/css/portal.css" rel="stylesheet">
</head>
<body class="portal">
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="Tela principal.html"><img src="../assets/images/espacon-logo.png" alt="Espaço ON" width="148" height="48"></a>
      <button class="nav-toggle" id="navToggle" aria-label="Abrir menu" aria-expanded="false" aria-controls="siteNav">
        <i class="bx bx-menu"></i>
      </button>
      <nav class="site-nav" id="siteNav" aria-label="Navegação principal">
        <a href="Tela principal.html">Início</a>
        <a href="espacos.html" aria-current="page">Explorar espaços</a>
        <a href="Tela principal.html#como-funciona">Como funciona</a>
        <a href="contactos.html">Contactos</a>
      </nav>
      <div class="header-actions">
        <a class="btn btn--outline" href="../auth/login.html">Entrar</a>
        <a class="btn btn--navy" href="../auth/register.html">Criar conta</a>
      </div>
    </div>
  </header>

  <main>
    <section class="category-hero" id="categoryHero">
      <div class="wrap">
        <div class="category-hero__content">
          <a class="back-link" href="Tela principal.html"><i class="bx bx-left-arrow-alt"></i> Voltar aos tipos de eventos</a>
          <span class="eyebrow" id="categoryEyebrow"></span>
          <h1 id="categoryTitle"></h1>
          <p id="categoryDescription"></p>
          <div class="category-hero__chips">
            <div class="chips" id="categoryTags"></div>
            <div class="chips chips--benefits" id="categoryBenefits"></div>
          </div>
        </div>
      </div>
    </section>

    <div class="wrap">
      <section class="guide">
        <div>
          <span class="eyebrow">Como escolher</span>
          <h2>O que deve considerar</h2>
          <p id="categoryGuidance"></p>
        </div>
        <ul id="categoryChecklist"></ul>
      </section>
    </div>

    <section class="section wrap">
      <div class="section-head section-head--split">
        <div>
          <span class="eyebrow">Espaços desta categoria</span>
          <h2 id="venueSectionTitle"></h2>
          <p>Compare capacidade, localização e preço inicial antes de escolher.</p>
        </div>
        <span class="count-pill" id="venueCount"></span>
      </div>

      <div class="venue-grid" id="categoryVenueGrid"></div>
    </section>
  </main>

  <script src="../assets/js/portal.js"></script>
  <script src="../assets/js/categoria-eventos.js"></script>
</body>
</html>
